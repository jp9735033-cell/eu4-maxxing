l_english:

 ### eu4-maxxing: national ideas for the four Chinese player nations.
 ### The idea keys carry numeric suffixes because they were seeded from the
 ### vanilla Qing set: 1 = Wu, 2 = Yue, 3 = Shu, 4 = Yan.

 ### Yan - Beijing, the northern frontier and the Mandate of Heaven ###
 YAN_ideas:0 "Yan Ideas"
 YAN_ideas_start:0 "Yan Traditions"
 YAN_ideas_bonus:0 "Yan Ambition"
 expand_the_banners4:0 "The Northern Tax Rolls"
 expand_the_banners4_desc:0 "The frontier armies eat whether the harvest comes in or not. A census of every household between the Yellow River and the wall, honestly kept and honestly collected, is worth more to Beijing than a victory."
 the_green_standard_army4:0 "Credit of the Capital"
 the_green_standard_army4_desc:0 "A court that holds the old capital borrows on better terms than one that does not. The moneylenders of Beijing will lend to the Mandate at rates they would offer nobody else."
 pigtail_or_death4:0 "The Frontier Cavalry"
 pigtail_or_death4_desc:0 "Half the men in our northern garrisons were born on the steppe or married into it. Let them fight the way they know how, on horseback, and the border rides for us instead of against us."
 qng_bogda_khan4:0 "The Hanlin Academy"
 qng_bogda_khan4_desc:0 "The Academy trains the men who draft our edicts and the women who tutor our heirs. A state that can staff its own ministries need not buy talent at the price fools pay."
 the_chinese_rules4:0 "Servants of the Mandate"
 the_chinese_rules4_desc:0 "Heaven does not ask a candidate's family or sex, only whether the work is done. Every post in the army and the ministries goes to whoever can hold it."
 qing_viceroyalties4:0 "The Workshops of Hebei"
 qing_viceroyalties4_desc:0 "Iron, brick and powder, made within a week's cart ride of the wall. An army supplied from its own province is an army that never waits."
 the_ten_great_campaigns4:0 "The Great Levy of the North"
 the_ten_great_campaigns4_desc:0 "Nine garrisons, each with its own muster rolls, each answering to the capital. The north can put more men in the field than any three southern states together."

 ### Wu - Hangzhou, the Yangtze delta and the wealth of Jiangnan ###
 WUU_ideas:0 "Wu Ideas"
 WUU_ideas_start:0 "Wu Traditions"
 WUU_ideas_bonus:0 "Wu Ambition"
 expand_the_banners1:0 "The Silk Harvest"
 expand_the_banners1_desc:0 "Mulberry on every bank, looms in every second house. What the delta grows it also finishes, and it sells the finished thing."
 the_green_standard_army1:0 "The Delta Reforms"
 the_green_standard_army1_desc:0 "The prefectures of the delta are small, rich and close together. A reform decreed in Hangzhou is in force in Suzhou before the month is out."
 pigtail_or_death1:0 "The Levy of Wu"
 pigtail_or_death1_desc:0 "Men who have watched three dynasties tax their fields do not need to be told what a losing war costs. Wu levies fight because they know exactly what is behind them."
 qng_bogda_khan1:0 "The Canal Depots"
 qng_bogda_khan1_desc:0 "Grain, powder and replacements move by barge along the canal, not by cart along a road. A broken regiment is back at strength in a season."
 the_chinese_rules1:0 "Masters of the Delta Trade"
 the_chinese_rules1_desc:0 "Every cargo leaving the lower Yangtze passes a Wu tollhouse, is weighed on a Wu scale, and is insured by a Wu house."
 qing_viceroyalties1:0 "The Wards of Jiangnan"
 qing_viceroyalties1_desc:0 "The most densely settled ground in the world answers to one register. Where other states count provinces, Wu counts households."
 the_ten_great_campaigns1:0 "The Builders of Hangzhou"
 the_ten_great_campaigns1_desc:0 "Our masons raised a city on a marsh and a wall around a river mouth. There is no site in the empire they cannot be told to build on."

 ### Yue - Canton, the Pearl River and the southern sea ###
 YUE_ideas:0 "Yue Ideas"
 YUE_ideas_start:0 "Yue Traditions"
 YUE_ideas_bonus:0 "Yue Ambition"
 expand_the_banners2:0 "Settle the Southern Coast"
 expand_the_banners2_desc:0 "The hills behind Canton are empty and the islands off it emptier. Send the second sons south with seed and a boat, and the coast fills itself."
 the_green_standard_army2:0 "The Canton Customs"
 the_green_standard_army2_desc:0 "One port, one register, one set of duties, honestly assessed. Foreign merchants pay it gladly because they know what it will be before they arrive."
 pigtail_or_death2:0 "The Office of Barbarian Affairs"
 pigtail_or_death2_desc:0 "Canton has dealt with Arabs, Malays, Japanese and now Portuguese. A standing office of men who speak their languages is worth an army we do not have to raise."
 qng_bogda_khan2:0 "The Bogue Garrison"
 qng_bogda_khan2_desc:0 "The forts at the mouth of the Pearl River drill every day because the estuary they close is the only thing between Canton and the sea."
 the_chinese_rules2:0 "The Junk Fleets"
 the_chinese_rules2_desc:0 "Our merchantmen carry cannon and our warships carry cargo, and the distinction between them is a matter of the season."
 qing_viceroyalties2:0 "The Clan Compacts"
 qing_viceroyalties2_desc:0 "The great lineages of Guangdong settle their own disputes in their own halls. A magistrate who lets them do it hears very few cases."
 the_ten_great_campaigns2:0 "The Guns of Guangdong"
 the_ten_great_campaigns2_desc:0 "The foundries at Foshan copied the first Portuguese breech-loader within a year and improved it within two. Nobody in the empire casts a better barrel."

 ### Shu - Chengdu, the Sichuan basin and the roads west ###
 SHU_ideas:0 "Shu Ideas"
 SHU_ideas_start:0 "Shu Traditions"
 SHU_ideas_bonus:0 "Shu Ambition"
 expand_the_banners3:0 "The Shu Infantry"
 expand_the_banners3_desc:0 "There is no room for cavalry on a mountain road. Shu fights on foot, in column, and has done so for a thousand years."
 the_green_standard_army3:0 "The Basin Levies"
 the_green_standard_army3_desc:0 "The basin feeds more people per acre than any land in China and it can spare a great many of them. Losses that would end another state are made good in a summer."
 pigtail_or_death3:0 "The Salt Wells of Zigong"
 pigtail_or_death3_desc:0 "Brine drawn from a thousand feet down, boiled over gas from the same shaft. A monopoly nobody outside the basin can break."
 qng_bogda_khan3:0 "Drill in the Mountain Camps"
 qng_bogda_khan3_desc:0 "An army that spends its winters in the passes learns to hold formation on ground that has no flat place to stand."
 the_chinese_rules3:0 "Glory of the Han Restoration"
 the_chinese_rules3_desc:0 "Shu has always claimed to be the legitimate remnant rather than a province in rebellion. Every battle won in the field is an argument for that claim."
 qing_viceroyalties3:0 "The Governors of Sichuan"
 qing_viceroyalties3_desc:0 "One basin, one road in, one governor accountable for all of it. Administration is cheap when geography does half the work."
 the_ten_great_campaigns3:0 "The Fortified Passes"
 the_ten_great_campaigns3_desc:0 "Jianmen, Hanzhong, the plank roads over the gorges. An enemy who reaches the basin at all reaches it strung out and under fire."
