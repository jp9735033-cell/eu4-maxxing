 ### Great Wall decisions ###
 emx_great_wall_shanhaiguan_title:0 "Construct the Great Wall: Shanhaiguan"
 emx_great_wall_shanhaiguan_desc:0 "Where the mountains run down into the Bohai Sea, the wall must end in water or it does not end at all. Build the eastern terminus at Yongping.\n\nOnly one nation will ever build this section. Once it stands, it stands for the rest of the age, for whoever holds the province."
 emx_great_wall_juyongguan_title:0 "Construct the Great Wall: Juyongguan"
 emx_great_wall_juyongguan_desc:0 "The pass above Beijing is the shortest road an army from the steppe can take to the capital. Wall it.\n\nOnly one nation will ever build this section. Once it stands, it stands for the rest of the age, for whoever holds the province."
 emx_great_wall_datong_title:0 "Construct the Great Wall: Datong"
 emx_great_wall_datong_desc:0 "Datong has been the anchor of the Shanxi frontier since the Northern Wei. Give it the wall it has always needed.\n\nOnly one nation will ever build this section. Once it stands, it stands for the rest of the age, for whoever holds the province."
 emx_great_wall_jiayuguan_title:0 "Construct the Great Wall: Jiayuguan"
 emx_great_wall_jiayuguan_desc:0 "The last gate before the desert, at the western end of the Hexi Corridor. Beyond it there is no China.\n\nOnly one nation will ever build this section. Once it stands, it stands for the rest of the age, for whoever holds the province."

