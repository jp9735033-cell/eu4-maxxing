 emx_fertile_soil:0 "Fertile Soil"
 emx_river_delta:0 "River Delta"
 emx_tatar_dune:0 "Tatar Dune"

 ### Shu decisions ###
 emx_shu_looms_2133_title:0 "The Looms of Dege"
 emx_shu_looms_2133_desc:0 "Dege's monastery presses and its flocks share the same valley, and only one of them works its own material.\n\nConverts Dege to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_705_title:0 "The Looms of Gyegu"
 emx_shu_looms_705_desc:0 "Gyegu sits where the Kham roads meet. The fleece passes through it in both directions and is worked in neither.\n\nConverts Gyegu to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4519_title:0 "The Looms of Damxung"
 emx_shu_looms_4519_desc:0 "The northern pastures above Lhasa keep more sheep than the city has looms to answer for.\n\nConverts Damxung to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4516_title:0 "The Looms of Purang"
 emx_shu_looms_4516_desc:0 "Purang's wool crosses the Himalaya as fleece and comes back over the same passes as cloth, at four times the price.\n\nConverts Purang to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4520_title:0 "The Looms of Rutog"
 emx_shu_looms_4520_desc:0 "Rutog's flocks graze the highest pasture in the world, and the wool leaves it unspun.\n\nConverts Rutog to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4693_title:0 "The Looms of Keriya"
 emx_shu_looms_4693_desc:0 "Keriya's oasis gathers the wool of the Kunlun foothills and sends every bale on unworked.\n\nConverts Keriya to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_2124_title:0 "The Looms of Yarkand"
 emx_shu_looms_2124_desc:0 "Yarkand is the great market of the southern Tarim. It should sell finished cloth, not other men's raw material.\n\nConverts Yarkand to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4210_title:0 "The Looms of Yangi Hissar"
 emx_shu_looms_4210_desc:0 "Yangi Hissar knows metal and the forge. Set the loom beside the anvil.\n\nConverts Yangi Hissar to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4209_title:0 "The Looms of Maralbexi"
 emx_shu_looms_4209_desc:0 "Maralbexi lies on the Kashgar road where the caravans load their fleece. Let them load it woven.\n\nConverts Maralbexi to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_739_title:0 "The Looms of Kashgar"
 emx_shu_looms_739_desc:0 "Kashgar is where the western trade begins, and it should not begin with raw fleece.\n\nConverts Kashgar to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_719_title:0 "The Looms of Uliastai"
 emx_shu_looms_719_desc:0 "The steppe flocks around Uliastai are the largest herds we can reach, and not one loom stands among them.\n\nConverts Uliastai to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_2074_title:0 "The Looms of Ladakh"
 emx_shu_looms_2074_desc:0 "Ladakh's fine wool goes down to the Kashmiri looms every season. Let it stay in Ladakh.\n\nConverts Ladakh to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4521_title:0 "The Looms of Skardu"
 emx_shu_looms_4521_desc:0 "Skardu on the upper Indus floats its wool downstream unworked, as it always has.\n\nConverts Skardu to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_2073_title:0 "The Looms of Baltistan"
 emx_shu_looms_2073_desc:0 "Baltistan's mountain flocks are shorn for other men's looms and always have been.\n\nConverts Baltistan to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4481_title:0 "The Looms of Punakah"
 emx_shu_looms_4481_desc:0 "Punakah's valley weaves already, but in small quantity and for itself alone.\n\nConverts Punakah to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_565_title:0 "The Looms of Bhutan"
 emx_shu_looms_565_desc:0 "The Bhutanese highlands keep far more sheep than they keep weavers.\n\nConverts Bhutan to cloth. Requires 400 ducats in the treasury and costs exactly that 400."
 emx_shu_looms_4482_title:0 "The Looms of Sikkim"
 emx_shu_looms_4482_desc:0 "Sikkim's fleece crosses into Bengal before a single hand has worked it.\n\nConverts Sikkim to cloth. Requires 400 ducats in the treasury and costs exactly that 400."

 ### The Silk Road & The Spice Route Shared Missions ###

 ### Silk Road & Spice Route Shared Localisation ###
 emx_silk_road_1_title:0 "Reopen the Gansu Corridor"
 emx_silk_road_1_desc:0 "The ancient overland corridor through Gansu and Yumen is the gateway to the West. Secure complete control over West and East Gansu to open the Silk Road. Grants +25% Caravan Power."
 emx_silk_road_2_title:0 "The Road to Samarkand"
 emx_silk_road_2_desc:0 "Cross the Taklamakan Desert and push through the Pamir Mountains into Transoxiana, securing the great oasis hubs of Kashgar and Samarkand. Grants +50% Caravan Power."
 emx_silk_road_crimea_title:0 "Northern Route: Crimea"
 emx_silk_road_crimea_desc:0 "Push northwest across the Pontic-Caspian steppe to control the Black Sea emporium of Kaffa and the Crimean peninsula. Grants +100% Caravan Power, +25% Price for Chinaware & Silk."
 emx_silk_road_persia_title:0 "Southern Route: Persia"
 emx_silk_road_persia_desc:0 "Subjugate the Iranian Plateau and its historic markets of Isfahan and Tabriz. Grants +75% Caravan Power."
 emx_silk_road_trabzon_title:0 "Pontic Gateway: Trabzon"
 emx_silk_road_trabzon_desc:0 "Control the Pontic Black Sea terminus at Trabzon and the major market of Tabriz to secure the northern Anatolian trade route. Grants +100% Caravan Power, +25% Price for Chinaware & Silk."
 emx_silk_road_halep_sham_title:0 "Levant Termini: Halep & Sham"
 emx_silk_road_halep_sham_desc:0 "Conquer and core the ancient Mediterranean trade hubs of Aleppo, Damascus, and Antioch. Grants +100% Caravan Power, +25% Price for Chinaware & Silk."
 emx_silk_road_capstone_title:0 "Lord of the Silk Road"
 emx_silk_road_capstone_desc:0 "From China through Samarkand to Crimea, Trabzon, and Damascus, the entire expanse of the Silk Road is under our undisputed dominion. Grants +25% Trade Steering, +25% Trade Efficiency, and +200% Caravan Power."
 emx_spice_route_malacca_title:0 "Spice Route: Malacca"
 emx_spice_route_malacca_desc:0 "The Strait of Malacca connects the South China Sea to the Indian Ocean. Secure at least 50% trade share in the Malacca trade node."
 emx_spice_route_bengal_title:0 "Spice Route: Bengal"
 emx_spice_route_bengal_desc:0 "The rich ports and delta of Bengal channel the wealth of eastern India. Reach at least 50% trade share in the Bengal trade node."
 emx_spice_route_coromandel_title:0 "Spice Route: Coromandel"
 emx_spice_route_coromandel_desc:0 "The textile emporiums of the Coromandel coast supply western and eastern commerce. Reach at least 50% trade share in Coromandel."
 emx_spice_route_gujarat_title:0 "Spice Route: Gujarat"
 emx_spice_route_gujarat_desc:0 "The Gujarati ports and Surat command the wealth of western India. Reach at least 50% trade share in the Gujarat trade node."
 emx_spice_route_hormuz_title:0 "Spice Route: Hormuz"
 emx_spice_route_hormuz_desc:0 "The Strait of Hormuz controls all maritime entrance into the Persian Gulf. Reach at least 50% trade share in Hormuz. Grants +25% Price for Spices and Tea."
 emx_spice_route_aden_title:0 "Spice Route: Gulf of Aden"
 emx_spice_route_aden_desc:0 "The Bab-el-Mandeb gates the maritime route between the Indian Ocean and the Red Sea. Reach at least 50% trade share in the Gulf of Aden."
 emx_spice_route_alexandria_title:0 "Spice Route: Alexandria"
 emx_spice_route_alexandria_desc:0 "Alexandria connects the riches of the Orient directly to Mediterranean commerce. Reach at least 50% trade share in Alexandria. Grants +25% Price for Spices and Tea."
 emx_spice_route_capstone_title:0 "Master of the Spice Routes"
 emx_spice_route_capstone_desc:0 "Our merchant fleets command every key sea lane from Malacca across India, Arabia, and Egypt. The maritime Spice Route is our personal monopoly. Permanently increases the global price of Spices and Tea by +50%."

