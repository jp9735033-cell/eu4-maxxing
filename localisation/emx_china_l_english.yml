 emx_yue_silk_road_3_desc:0 "Amol, Antioch and Constantinople. The road runs from one sea to the other."
 emx_yue_army_1_title:0 "The Divine Engine Division"
 emx_yue_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_yue_army_2_title:0 "Drill the Green Standard"
 emx_yue_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
