 ### eu4-maxxing: Yan / Wu / Shu / Yue warring-states content ###

 ### Yan missions ###
 emx_yan_seize_hangzhou_title:0 "Take Hangzhou"
 emx_yan_seize_hangzhou_desc:0 "Wu grew fat on the silk of the delta while the north held the frontier. Take Hangzhou and core it, and the looms will work for Beijing."
 emx_yan_seize_chengdu_title:0 "Take Chengdu"
 emx_yan_seize_chengdu_desc:0 "The Sichuan basin has hidden behind its mountains for long enough. Take Chengdu and core it."
 emx_yan_seize_canton_title:0 "Take Canton"
 emx_yan_seize_canton_desc:0 "Yue counts the wealth of the southern seas. Take Canton and core it, and that wealth counts for us."
 emx_yan_home_1_title:0 "Reconstruct Beijing"
 emx_yan_home_1_desc:0 "The capital is a garrison camp with a palace in it. Raise Beijing to 36 development and give it a fort, and the first course of the Great Wall is laid."
 emx_yan_home_2_title:0 "The Hejian Plain"
 emx_yan_home_2_desc:0 "Bring the grain fields of Hejian to 30 development."
 emx_yan_home_3_title:0 "Fortify Baoding"
 emx_yan_home_3_desc:0 "Baoding guards the road south from the capital. Bring it to 30 development."
 emx_yan_home_4_title:0 "The Fields of Daming"
 emx_yan_home_4_desc:0 "Bring Daming to 30 development."
 emx_yan_home_5_title:0 "The Markets of Zhending"
 emx_yan_home_5_desc:0 "Bring Zhending to 30 development."
 emx_yan_home_6_title:0 "The Walls of Yongping"
 emx_yan_home_6_desc:0 "Yongping is where the wall will meet the sea. Bring it to 30 development."
 emx_yan_home_7_title:0 "The Ningyuan Command"
 emx_yan_home_7_desc:0 "Ningyuan is the gate to Liaodong. Bring it to 30 development."
 emx_yan_garrison_1_title:0 "The Xuanhua Garrison"
 emx_yan_garrison_1_desc:0 "Xuanhua covers the northwestern approach. Take it and core it."
 emx_yan_garrison_2_title:0 "The Datong Garrison"
 emx_yan_garrison_2_desc:0 "Datong is the anchor of the Shanxi frontier. Take it and core it."
 emx_yan_garrison_3_title:0 "The Shanhai Pass"
 emx_yan_garrison_3_desc:0 "Hold Yongping, where the mountains run into the sea, and the eastern end of the wall is ours."
 emx_yan_garrison_4_title:0 "The Ningyuan Bastion"
 emx_yan_garrison_4_desc:0 "Build a fort at Ningyuan and the road into Liaodong is ours to open or close."
 emx_yan_garrison_5_title:0 "Beyond the Wall"
 emx_yan_garrison_5_desc:0 "A wall that ends at the sea invites a march around it. Take Shenyang and core it, and the Nine Garrisons are complete."
 emx_yan_avenge_tumu_title:0 "Avenge Tumu"
 emx_yan_avenge_tumu_desc:0 "An emperor was taken alive on the steppe within living memory. Hold Xilin Gol, Ordos, Ulaanchab and Hetao and no rider will come that way again."
 emx_yan_grand_canal_title:0 "The Grand Canal"
 emx_yan_grand_canal_desc:0 "Grain moves north by water or it does not move. Hold Beijing, Jinan, Yanzhou, Huai'an and Nanjing and the canal is one artery again."
 emx_yan_yongle_dadian_title:0 "The Yongle Encyclopaedia"
 emx_yan_yongle_dadian_desc:0 "Set the scholars to copying every book that exists. Reach administrative technology 12, 400 total development and 36 development in Beijing."
 emx_yan_northern_frontier_title:0 "Hold the Whole Frontier"
 emx_yan_northern_frontier_desc:0 "Shenyang, Andong, Xuanhua, Datong, Yongping and Ningyuan in one hand, and the north has no open door."
 emx_yan_unify_china_title:0 "Unify China"
 emx_yan_unify_china_desc:0 "Beijing, Hangzhou, Chengdu, Canton and Shenyang, all owned and all cored. The warring states end here."
 emx_yan_army_1_title:0 "The Divine Engine Division"
 emx_yan_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_yan_army_2_title:0 "Drill the Green Standard"
 emx_yan_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
 emx_yan_army_3_title:0 "The New Model Army"
 emx_yan_army_3_desc:0 "Reach military technology 26 and 80% army professionalism."
 emx_yan_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_yan_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_yan_industry_2_title:0 "The Looms of Jiangnan"
 emx_yan_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_yan_industry_3_title:0 "The Ironworks of Guangdong"
 emx_yan_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_yan_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_yan_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_yan_industry_5_title:0 "The Workshops of the North"
 emx_yan_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."

 ### Wu missions ###
 emx_wu_seize_beijing_title:0 "Take Beijing"
 emx_wu_seize_beijing_desc:0 "The northern court claims the Mandate because it sits on the old capital. Take Beijing and core it, and the claim changes hands."
 emx_wu_seize_chengdu_title:0 "Take Chengdu"
 emx_wu_seize_chengdu_desc:0 "Shu holds the upper Yangtze and every boat that comes down it. Take Chengdu and core it."
 emx_wu_seize_canton_title:0 "Take Canton"
 emx_wu_seize_canton_desc:0 "Two great ports cannot both rule the coast. Take Canton and core it."
 emx_wu_home_1_title:0 "Rebuild Hangzhou"
 emx_wu_home_1_desc:0 "Hangzhou was the richest city on earth once. Bring it back to 30 development."
 emx_wu_home_2_title:0 "The Wharves of Suzhou"
 emx_wu_home_2_desc:0 "Bring Suzhou to 30 development."
 emx_wu_home_3_title:0 "The Zhenjiang Locks"
 emx_wu_home_3_desc:0 "Zhenjiang is where the canal meets the Yangtze. Bring it to 30 development."
 emx_wu_home_4_title:0 "The Port of Ningbo"
 emx_wu_home_4_desc:0 "Bring Ningbo to 30 development."
 emx_wu_home_5_title:0 "The Paddies of Shaoxin"
 emx_wu_home_5_desc:0 "Bring Shaoxin to 30 development."
 emx_wu_home_6_title:0 "The Hills of Ningguo"
 emx_wu_home_6_desc:0 "Bring Ningguo to 30 development."
 emx_wu_home_7_title:0 "The Wenzhou Yards"
 emx_wu_home_7_desc:0 "Bring Wenzhou to 30 development and the delta levy is raised in full."
 emx_wu_fort_1_title:0 "The Hangzhou Levy"
 emx_wu_fort_1_desc:0 "Bring Hangzhou to 40 development. A city that large musters regiments the countryside never could."
 emx_wu_fort_2_title:0 "The Suzhou Levy"
 emx_wu_fort_2_desc:0 "Bring Suzhou to 40 development."
 emx_wu_fort_3_title:0 "The Ningbo Levy"
 emx_wu_fort_3_desc:0 "Bring Ningbo to 40 development."
 emx_wu_fort_4_title:0 "The Zhenjiang Levy"
 emx_wu_fort_4_desc:0 "Bring Zhenjiang to 40 development."
 emx_wu_fort_5_title:0 "The Wenzhou Levy"
 emx_wu_fort_5_desc:0 "Bring Wenzhou to 40 development. Five cities of forty, and the delta raises an army from its streets alone."
 emx_wu_the_wu_fleet_title:0 "The Wu Fleet"
 emx_wu_the_wu_fleet_desc:0 "Hold Ningbo and Wenzhou, build a shipyard at Ningbo and put thirty ships to sea. The wokou raids stop."
 emx_wu_suzhou_looms_title:0 "The Looms of Suzhou"
 emx_wu_suzhou_looms_desc:0 "Suzhou at 38 development and Hangzhou at 40, both with workshops, and the silk of Jiangnan has no rival."
 emx_wu_jiangxi_and_fujian_title:0 "Jiangxi and Fujian"
 emx_wu_jiangxi_and_fujian_desc:0 "Take and core Nanchang, Fuzhou and Xiamen. The southern trade routes answer to the delta."
 emx_wu_jiangnan_levy_title:0 "The Jiangnan Levy"
 emx_wu_jiangnan_levy_desc:0 "Field sixty regiments at 40% army professionalism. A merchant state can still fight."
 emx_wu_unify_china_title:0 "Unify China"
 emx_wu_unify_china_desc:0 "Beijing, Hangzhou, Chengdu, Canton and Shenyang, all owned and all cored. The warring states end here."
 emx_wu_army_1_title:0 "The Divine Engine Division"
 emx_wu_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_wu_army_2_title:0 "Drill the Green Standard"
 emx_wu_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
 emx_wu_army_3_title:0 "The New Model Army"
 emx_wu_army_3_desc:0 "Reach military technology 26 and 80% army professionalism."
 emx_wu_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_wu_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_wu_industry_2_title:0 "The Looms of Jiangnan"
 emx_wu_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_wu_industry_3_title:0 "The Ironworks of Guangdong"
 emx_wu_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_wu_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_wu_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_wu_industry_5_title:0 "The Workshops of the North"
 emx_wu_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."

 ### Shu missions ###
 emx_shu_seize_beijing_title:0 "Take Beijing"
 emx_shu_seize_beijing_desc:0 "The Han restoration was always a march on the northern capital. Take Beijing and core it."
 emx_shu_seize_hangzhou_title:0 "Take Hangzhou"
 emx_shu_seize_hangzhou_desc:0 "Wu sits at the mouth of our river. Take Hangzhou and core it."
 emx_shu_seize_canton_title:0 "Take Canton"
 emx_shu_seize_canton_desc:0 "Take Canton and core it, and the southern sea trade pays for the western roads."
 emx_shu_home_1_title:0 "Rebuild Chengdu"
 emx_shu_home_1_desc:0 "Chengdu is the granary of the west. Bring it to 30 development."
 emx_shu_home_2_title:0 "The Wharves of Chongqing"
 emx_shu_home_2_desc:0 "Bring Chongqing to 30 development."
 emx_shu_home_3_title:0 "The Fields of Langzhong"
 emx_shu_home_3_desc:0 "Bring Langzhong to 30 development."
 emx_shu_home_4_title:0 "The Songqu Marches"
 emx_shu_home_4_desc:0 "Bring Songqu to 30 development."
 emx_shu_home_5_title:0 "The Dazhou Terraces"
 emx_shu_home_5_desc:0 "Bring Dazhou to 30 development."
 emx_shu_home_6_title:0 "The Jiazhou Ferry"
 emx_shu_home_6_desc:0 "Bring Jiazhou to 30 development."
 emx_shu_home_7_title:0 "The Luzhou Market"
 emx_shu_home_7_desc:0 "Bring Luzhou to 30 development. The basin is fully in hand."
 emx_shu_west_1_title:0 "The Roads to Lhasa"
 emx_shu_west_1_desc:0 "Hold Lhasa and Shigatse and eight provinces of Utsang, Tsang and Ngari. Mountain roads cost what mountain roads cost - after this, they cost less."
 emx_shu_west_2_title:0 "The Kham Highlands"
 emx_shu_west_2_desc:0 "Hold Tachienlu and Gyegu and seven provinces of Kham and Amdo."
 emx_shu_west_3_title:0 "The Tea-Horse Road"
 emx_shu_west_3_desc:0 "Take Changtang, Tsaparang and Paro. With the last stages of the Lhasa trade outside Nepal in hand, the whole route is ours."
 emx_shu_west_4_title:0 "The Hexi Corridor"
 emx_shu_west_4_desc:0 "Yumen, Zhangye, Liangzhou and Xining. Desert costs half again to settle - it will not any more."
 emx_shu_west_5_title:0 "The Lop Nor Oases"
 emx_shu_west_5_desc:0 "Hold five provinces of Shanshan and the Turpan-Kumul oases."
 emx_shu_west_6_title:0 "The Cities of Altishahr"
 emx_shu_west_6_desc:0 "Take Kashgar and hold six provinces of the Tarim basin and Kashgaria."
 emx_shu_west_7_title:0 "South Dzungaria"
 emx_shu_west_7_desc:0 "Hold four provinces of Dzungaria. The west is a country now, not a frontier."
 emx_shu_secure_hanzhong_title:0 "Secure Hanzhong"
 emx_shu_secure_hanzhong_desc:0 "Every march out of Sichuan and every march into it goes through Hanzhong. Take it and core it."
 emx_shu_southern_campaign_title:0 "The Southern Campaign"
 emx_shu_southern_campaign_desc:0 "Guiyang, Liangshan, Zhenyuan and Bozhou. Pacify the south before turning north, as it was done before."
 emx_shu_northern_expeditions_title:0 "The Northern Expeditions"
 emx_shu_northern_expeditions_desc:0 "Xi'an, Fengxiang and Tianshui, owned and cored. The expedition that was tried six times succeeds once."
 emx_shu_tea_horse_road_title:0 "The Horse Markets"
 emx_shu_tea_horse_road_desc:0 "Hold Taozhou, Xining and Gyegu and field twenty regiments of cavalry. Tea goes west, horses come east."

 ### Yue missions ###
 emx_yue_seize_beijing_title:0 "Take Beijing"
 emx_yue_seize_beijing_desc:0 "The north has taxed the southern trade for centuries. Take Beijing and core it, and the accounts are settled."
 emx_yue_seize_hangzhou_title:0 "Take Hangzhou"
 emx_yue_seize_hangzhou_desc:0 "Two great ports cannot both rule the coast. Take Hangzhou and core it."
 emx_yue_seize_chengdu_title:0 "Take Chengdu"
 emx_yue_seize_chengdu_desc:0 "Take Chengdu and core it, and the upper river is closed to everyone but us."
 emx_yue_home_1_title:0 "Rebuild Canton"
 emx_yue_home_1_desc:0 "Canton is the gate of the southern sea. Bring it to 30 development."
 emx_yue_home_2_title:0 "The Anchorage at Macau"
 emx_yue_home_2_desc:0 "Bring Macau to 30 development."
 emx_yue_home_3_title:0 "The Shiuhing Reach"
 emx_yue_home_3_desc:0 "Bring Shiuhing to 30 development."
 emx_yue_home_4_title:0 "The Leizhou Peninsula"
 emx_yue_home_4_desc:0 "Bring Leichow to 30 development."
 emx_yue_home_5_title:0 "The Limchow Coast"
 emx_yue_home_5_desc:0 "Bring Limchow to 30 development."
 emx_yue_home_6_title:0 "Settle Hainan"
 emx_yue_home_6_desc:0 "Bring Kingchow to 30 development."
 emx_yue_home_7_title:0 "The Ngaichow Roads"
 emx_yue_home_7_desc:0 "Bring Ngaichow to 30 development. The home coast is finished."
 emx_yue_sea_1_title:0 "The Pearl River Ports"
 emx_yue_sea_1_desc:0 "Hold Canton, Macau and Shiuhing and put fifteen ships to sea."
 emx_yue_sea_2_title:0 "The Hainan Stations"
 emx_yue_sea_2_desc:0 "Hold Kingchow, Leichow and Limchow and put twenty-five ships to sea."
 emx_yue_sea_3_title:0 "The Western Coast"
 emx_yue_sea_3_desc:0 "Hold Ngaichow, Ngchow, Waichow and Shiukwan."
 emx_yue_sea_4_title:0 "The Chaozhou Yards"
 emx_yue_sea_4_desc:0 "Take and core Chaochow, Xiamen and Fuzhou. The whole southern coast builds our hulls."
 emx_yue_sea_5_title:0 "The Treasure Fleet"
 emx_yue_sea_5_desc:0 "Sixty ships at sea. Every port we own becomes a station of the fleet."
 emx_yue_two_guangs_title:0 "Unite the Two Guangs"
 emx_yue_two_guangs_desc:0 "Guilin, Liuzhou, Namning, Guangxi and Ngchow, owned and cored. Nanyue is whole again."
 emx_yue_bogue_forts_title:0 "The Bogue Forts"
 emx_yue_bogue_forts_desc:0 "A fort at Canton, a shipyard at Macau and thirty ships. Nothing enters the estuary without our leave."
 emx_yue_jiaozhi_title:0 "Jiaozhi Restored"
 emx_yue_jiaozhi_desc:0 "Thang Long and Viet Bac, owned and cored. The southern commandery answers to Canton again."
 emx_yue_nanyang_trade_title:0 "The Nanyang Trade"
 emx_yue_nanyang_trade_desc:0 "Hold four provinces in Malaya. The south sea trade has a landlord."
 emx_yue_unify_china_title:0 "Unify China"
 emx_yue_unify_china_desc:0 "Beijing, Hangzhou, Chengdu, Canton and Shenyang, all owned and all cored. The warring states end here."
 emx_yue_army_1_title:0 "The Divine Engine Division"
 emx_yue_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
