 emx_yue_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_yue_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_yue_industry_2_title:0 "The Looms of Jiangnan"
 emx_yue_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_yue_industry_3_title:0 "The Ironworks of Guangdong"
 emx_yue_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_yue_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_yue_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_yue_industry_5_title:0 "The Workshops of the North"
 emx_yue_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."

