 ### Wu Opening Event & Lore ###
 emx_wu_flavor.1.t:0 "The Sacred Realm of Wu: Ashes and Faith"
 emx_wu_flavor.1.d:0 "The empire has collapsed into anarchy and blood. From the ashes of the ruined dynasty, the prosperous delta of Jiangnan has withdrawn under the spiritual stewardship of the monastic orders and the sacred temples of Hangzhou.\n\n§RThe Shattered Realm (Starting Burden):§!\nDecimated by the civil war, our commerce is paralyzed, our military traditions are shattered, and our foreign trade lies in ruin (§R-1.00 Army Tradition Decay, -20% Trade Efficiency, -20% Goods Produced§!).\n\n§Y=== HOW TO PLAY WU & PATH TO RESTORATION ===§!\n\n§Y1. The Monastic State & Inward Perfection:§!\nWu begins under monastic theocratic rule with the permanent estate privilege §YInward Perfection§! granted to the §YClergy (Monastic Orders)§!, which §Rcannot be revoked§! (provides dynamic Tolerance of the True Faith, Missionary Strength, and Development Cost bonuses that scale with Crownland and Clergy land share).\n\n§Y2. The Dynamic Faith Scaling:§!\nAs a sacred monastic theocracy, Wu harnesses divine faith into immense earthly power through dynamic triggered modifier tiers:\n- §YTolerance of the True Faith (TotF)§!: Unlocks massive §GManpower pools (+150% max)§!, §GArmy Tradition (+1.50/yr)§!, §GLand Morale (+15%)§!, and §GLand Force Limit (+30%)§!.\n- §YMissionary Strength (MS)§!: Slashes §GCore Creation Cost (CCR, up to -75%)§! and §GProvince War Score Cost (up to -150%)§!, allowing swift conquest of entire empires in single peace deals!\n§O(Note: Higher scaling tiers require endowing land to the Clergy estate: >=20% for Tiers 1-5, >=35% for Tiers 6-10, >=50% for Tiers 11-15.)§!\n\n§Y3. The Four Imperial Pillars:§!\nMarch forth from Hangzhou to conquer the four historic metropolises of China:\n- §YNanjing (Center)§!: Reinstates the Eunuchs & grants §G-5% Tech / Idea Cost§!\n- §YCanton (South)§!: Reinstates the Burghers & grants §G-5% Tech / Idea Cost§!\n- §YChengdu (West)§!: Reinstates the Nobility & grants §G-5% Tech / Idea Cost§!\n- §YBeijing (North)§!: Reinstates the Nomads & grants §G-5% Tech / Idea Cost§!\nTogether, these four pillars grant a permanent §G-20% Technology & Idea Cost§! reduction.\n\n§Y4. Reclaiming the Mandate:§!\nWith the realm reunited, restore the §YGreat Ming Dynasty§! and dominate both the overland §YSilk Road§! and the maritime §YSpice Routes§! across all of Asia!"
 emx_wu_flavor.1.a:0 "Through faith and iron, we shall resurrect the Empire!"
