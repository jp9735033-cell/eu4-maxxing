 ### eu4-maxxing: Wu Kingdom Localisation ###

 ### Wu Missions ###
 ### Wu missions ###
 emx_wu_seize_beijing_title:0 "Take Beijing"
 emx_wu_seize_beijing_desc:0 "The northern court claims the Mandate because it sits on the old capital. Take Beijing and core it, and the claim changes hands."
 emx_wu_seize_chengdu_title:0 "Take Chengdu"
 emx_wu_seize_chengdu_desc:0 "Shu holds the upper Yangtze and every boat that comes down it. Take Chengdu and core it."
 emx_wu_seize_canton_title:0 "Take Canton"
 emx_wu_seize_canton_desc:0 "Two great ports cannot both rule the coast. Take Canton and core it."
 emx_wu_home_1_title:0 "Rebuild Hangzhou"
 emx_wu_home_1_desc:0 "Hangzhou was the richest city on earth once. Bring it back to 30 development."
 emx_wu_home_2_title:0 "The Wharves of Suzhou"
 emx_wu_home_2_desc:0 "Bring Suzhou to 30 development."
 emx_wu_home_3_title:0 "The Zhenjiang Locks"
 emx_wu_home_3_desc:0 "Zhenjiang is where the canal meets the Yangtze. Bring it to 30 development."
 emx_wu_home_4_title:0 "The Port of Ningbo"
 emx_wu_home_4_desc:0 "Bring Ningbo to 30 development."
 emx_wu_home_5_title:0 "The Paddies of Shaoxin"
 emx_wu_home_5_desc:0 "Bring Shaoxin to 30 development."
 emx_wu_home_6_title:0 "The Hills of Ningguo"
 emx_wu_home_6_desc:0 "Bring Ningguo to 30 development."
 emx_wu_home_7_title:0 "The Wenzhou Yards"
 emx_wu_home_7_desc:0 "Bring Wenzhou to 30 development and the delta levy is raised in full."
 emx_wu_fort_1_title:0 "The Hangzhou Levy"
 emx_wu_fort_1_desc:0 "Bring Hangzhou to 40 development. A city that large musters regiments the countryside never could."
 emx_wu_fort_2_title:0 "The Suzhou Levy"
 emx_wu_fort_2_desc:0 "Bring Suzhou to 40 development."
 emx_wu_fort_3_title:0 "The Ningbo Levy"
 emx_wu_fort_3_desc:0 "Bring Ningbo to 40 development."
 emx_wu_fort_4_title:0 "The Zhenjiang Levy"
 emx_wu_fort_4_desc:0 "Bring Zhenjiang to 40 development."
 emx_wu_fort_5_title:0 "The Wenzhou Levy"
 emx_wu_fort_5_desc:0 "Bring Wenzhou to 40 development. Five cities of forty, and the delta raises an army from its streets alone."
 emx_wu_the_wu_fleet_title:0 "The Wu Fleet"
 emx_wu_the_wu_fleet_desc:0 "Hold Ningbo and Wenzhou, build a shipyard at Ningbo and put thirty ships to sea. The wokou raids stop."
 emx_wu_suzhou_looms_title:0 "The Looms of Suzhou"
 emx_wu_suzhou_looms_desc:0 "Suzhou at 38 development and Hangzhou at 40, both with workshops, and the silk of Jiangnan has no rival."
 emx_wu_jiangxi_and_fujian_title:0 "Jiangxi and Fujian"
 emx_wu_jiangxi_and_fujian_desc:0 "Take and core Nanchang, Fuzhou and Xiamen. The southern trade routes answer to the delta."
 emx_wu_jiangnan_levy_title:0 "The Jiangnan Levy"
 emx_wu_jiangnan_levy_desc:0 "Field sixty regiments at 40% army professionalism. A merchant state can still fight."
 emx_wu_unify_china_title:0 "Unify China"
 emx_wu_unify_china_desc:0 "Beijing, Hangzhou, Chengdu, Canton and Shenyang, all owned and all cored. The warring states end here."
 emx_wu_army_1_title:0 "The Divine Engine Division"
 emx_wu_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_wu_army_2_title:0 "Drill the Green Standard"
 emx_wu_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
 emx_wu_army_3_title:0 "The New Model Army"
 emx_wu_army_3_desc:0 "Reach military technology 26 and 80% army professionalism."
 emx_wu_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_wu_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_wu_industry_2_title:0 "The Looms of Jiangnan"
 emx_wu_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_wu_industry_3_title:0 "The Ironworks of Guangdong"
 emx_wu_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_wu_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_wu_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_wu_industry_5_title:0 "The Workshops of the North"
 emx_wu_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."


