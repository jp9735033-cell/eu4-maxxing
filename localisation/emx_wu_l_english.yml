 ### eu4-maxxing: Wu Kingdom Localisation ###

 ### Starting Modifiers ###
 emx_spoils_of_wu:0 "Spoils of Wu"
 emx_wu_shattered_state:0 "Shattered Realm"
 emx_wu_shattered_state_desc:0 "Decimated by the civil war, the realm suffers from collapsing military tradition and ruined commerce until restored by state reforms."

 ### 4 Capital Modifiers (-5% Tech and -5% Idea Cost each, -20% Total) ###
 emx_wu_nanjing_center:0 "Great Center of Nanjing"
 emx_wu_nanjing_center_desc:0 "The imperial southern capital serves as a beacon of scholar administration and statecraft, dramatically lowering technological and intellectual costs."
 emx_wu_canton_center:0 "Great Center of Canton"
 emx_wu_canton_center_desc:0 "The premier ocean trade hub of the South China Sea connects the realm to global knowledge and mercantile innovation."
 emx_wu_chengdu_center:0 "Great Center of Chengdu"
 emx_wu_chengdu_center_desc:0 "The western citadel of Shu blends intellectual academies with deep strategic wisdom and martial philosophy."
 emx_wu_beijing_center:0 "Great Center of Beijing"
 emx_wu_beijing_center_desc:0 "The majestic northern capital guards the imperial frontier and synthesizes bureaucratic rigor with northern strategy."

 ### Campaign and Restoration Modifiers ###
 emx_wu_river_bastion:0 "River Bastion of Zhenjiang"
 emx_wu_lingnan_march:0 "Lingnan Mountain March"
 emx_wu_gorges_dominance:0 "Dominance of the Three Gorges"
 emx_wu_hebei_assault:0 "Hebei Grand Offensive"
 emx_wu_ming_reborn:0 "Great Ming Reborn"
 emx_wu_celestial_harmony:0 "Universal Celestial Harmony"

 ### Missions - Center Column: Nanjing Backbone ###
 emx_wu_call_of_nanjing_title:0 "Call of Nanjing"
 emx_wu_call_of_nanjing_desc:0 "Nanjing, the founding capital of Great Ming, lies just beyond the horizon. Mobilize our faithful regiments and prepare the campaign to secure the Southern Capital."
 emx_wu_liberate_nanjing_title:0 "Liberate Nanjing"
 emx_wu_liberate_nanjing_desc:0 "Liberate the Southern Capital! Reopen the ancestral halls of Emperor Hongwu, restore the imperial administrative court, and reinstate the Eunuch secretariat to manage the state apparatus."
 emx_wu_grand_mobilization_title:0 "Grand Mobilization"
 emx_wu_grand_mobilization_desc:0 "With the Southern Capital secured and the bureaucracy restored, proclaim the three-pronged grand campaign across the South, West, and North of China."

 ### Missions - Slot 1: Canton and Burghers ###
 emx_wu_cross_lingnan_mountains_title:0 "Lingnan Passes"
 emx_wu_cross_lingnan_mountains_desc:0 "March through the treacherous Lingnan mountain passes at Shaoguan, securing the gateway into the rich delta of Guangdong."
 emx_wu_conquer_canton_title:0 "Conquer Canton"
 emx_wu_conquer_canton_desc:0 "Conquer the bustling maritime metropolis of Canton (Guangzhou)! Re-establish the great merchant guilds, reopen ocean trade, and welcome the Burgher estate back into the realm."

 ### Missions - Slot 2: Chengdu and Nobility ###
 emx_wu_breach_three_gorges_title:0 "The Three Gorges"
 emx_wu_breach_three_gorges_desc:0 "Force the formidable natural defenses of the Three Gorges and seize Chongqing, clearing the mountain path into the fertile Sichuan basin."
 emx_wu_conquer_chengdu_title:0 "Conquer Chengdu"
 emx_wu_conquer_chengdu_desc:0 "Conquer Chengdu, the ancient capital of Shu! Revive the martial traditions of the Sichuan warrior-clans, bestow fiefs upon deserving commanders, and reinstate the Noble Gentry to lead our armies."

 ### Missions - Slot 4: Beijing and Nomadic Tribes ###
 emx_wu_hebei_offensive_title:0 "Hebei Offensive"
 emx_wu_hebei_offensive_desc:0 "Smash through the defensive lines of Shandong and Jinan, sweeping across the northern plains of Hebei towards the Forbidden City."
 emx_wu_conquer_beijing_title:0 "Conquer Beijing"
 emx_wu_conquer_beijing_desc:0 "Capture the Northern Capital of Beijing, extinguish the traitor court of Yan, and bring the northern horse pastures and nomadic tribes into our grand imperial coalition."

 ### Missions - Center Column: Great Ming Restoration ###
 emx_wu_four_pillars_united_title:0 "The Four Pillars"
 emx_wu_four_pillars_united_desc:0 "With Nanjing, Canton, Chengdu, and Beijing firmly under our righteous dominion, the four corners of China stand united. All estates bow before the ascendant throne."
 emx_wu_restore_great_ming_title:0 "Restore Great Ming"
 emx_wu_restore_great_ming_desc:0 "From a single righteous rebellion in Jiangnan, the legitimate empire rises from the ashes. Proclaim the Restoration of the Great Ming and summon all of Asia to pay tribute."
 emx_wu_celestial_mandate_restored_title:0 "Celestial Mandate"
 emx_wu_celestial_mandate_restored_desc:0 "All beneath Heaven is unified under righteous celestial rule. With perfect balance established among the estates and cosmic order restored, Heaven bestows its eternal Mandate upon our dynasty."

 ### Estate Unlock Custom Tooltips ###
 emx_wu_unlock_eunuchs_tt:0 "§GReinstates the §YEunuchs§! Estate into the government.§!"
 emx_wu_unlock_burghers_tt:0 "§GReinstates the §YBurghers§! Estate into the realm.§!"
 emx_wu_unlock_nobles_tt:0 "§GReinstates the §YNobility§! Estate into the realm.§!"
 emx_wu_unlock_nomads_tt:0 "§GReinstates the §YNomadic Tribes§! Estate into the realm.§!"

 ### Wu Decisions ###
 emx_wu_grant_land_to_clergy_title:0 "Endow Monastic Lands"
 emx_wu_grant_land_to_clergy_desc:0 "Transfer 5% Crownland to the monastic orders to expand their spiritual dominion and strengthen our zeal, provided their total land holding remains below 50%."

