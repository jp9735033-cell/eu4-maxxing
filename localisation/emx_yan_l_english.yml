l_english:
 ### eu4-maxxing: Yan Kingdom & Dynasty Localisation ###

 ### Yan Missions (Fixed Slots 3, 4, 5) ###
 ### Yan missions ###
 emx_yan_seize_hangzhou_title:0 "Take Hangzhou"
 emx_yan_seize_hangzhou_desc:0 "Wu grew fat on the silk of the delta while the north held the frontier. Take Hangzhou and core it, and the looms will work for Beijing."
 emx_yan_seize_chengdu_title:0 "Take Chengdu"
 emx_yan_seize_chengdu_desc:0 "The Sichuan basin has hidden behind its mountains for long enough. Take Chengdu and core it."
 emx_yan_seize_canton_title:0 "Take Canton"
 emx_yan_seize_canton_desc:0 "Yue counts the wealth of the southern seas. Take Canton and core it, and that wealth counts for us."
 emx_yan_home_1_title:0 "Reconstruct Beijing"
 emx_yan_home_1_desc:0 "The capital is a garrison camp with a palace in it. Raise Beijing to 36 development and give it a fort, and the first course of the Great Wall is laid."
 emx_yan_home_2_title:0 "The Hejian Plain"
 emx_yan_home_2_desc:0 "Bring the grain fields of Hejian to 30 development."
 emx_yan_home_3_title:0 "Fortify Baoding"
 emx_yan_home_3_desc:0 "Baoding guards the road south from the capital. Bring it to 30 development."
 emx_yan_home_4_title:0 "The Fields of Daming"
 emx_yan_home_4_desc:0 "Bring Daming to 30 development."
 emx_yan_home_5_title:0 "The Markets of Zhending"
 emx_yan_home_5_desc:0 "Bring Zhending to 30 development."
 emx_yan_home_6_title:0 "The Walls of Yongping"
 emx_yan_home_6_desc:0 "Yongping is where the wall will meet the sea. Bring it to 30 development."
 emx_yan_home_7_title:0 "The Ningyuan Command"
 emx_yan_home_7_desc:0 "Ningyuan is the gate to Liaodong. Bring it to 30 development."
 emx_yan_garrison_1_title:0 "The Xuanhua Garrison"
 emx_yan_garrison_1_desc:0 "Xuanhua covers the northwestern approach. Take it and core it."
 emx_yan_garrison_2_title:0 "The Datong Garrison"
 emx_yan_garrison_2_desc:0 "Datong is the anchor of the Shanxi frontier. Take it and core it."
 emx_yan_garrison_3_title:0 "The Shanhai Pass"
 emx_yan_garrison_3_desc:0 "Hold Yongping, where the mountains run into the sea, and the eastern end of the wall is ours."
 emx_yan_garrison_4_title:0 "The Ningyuan Bastion"
 emx_yan_garrison_4_desc:0 "Build a fort at Ningyuan and the road into Liaodong is ours to open or close."
 emx_yan_garrison_5_title:0 "Beyond the Wall"
 emx_yan_garrison_5_desc:0 "A wall that ends at the sea invites a march around it. Take Shenyang and core it, and the Nine Garrisons are complete."
 emx_yan_army_1_title:0 "The Divine Engine Division"
 emx_yan_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_yan_army_2_title:0 "Drill the Green Standard"
 emx_yan_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
 emx_yan_army_3_title:0 "The New Model Army"
 emx_yan_army_3_desc:0 "Reach military technology 26 and 80% army professionalism."
 emx_yan_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_yan_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_yan_industry_2_title:0 "The Looms of Jiangnan"
 emx_yan_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_yan_industry_3_title:0 "The Ironworks of Guangdong"
 emx_yan_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_yan_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_yan_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_yan_industry_5_title:0 "The Workshops of the North"
 emx_yan_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."


 ### Yan Specific Modifiers & Garrisons ###
 emx_spoils_of_yan:0 "Spoils of Yan"
 emx_yan_garrison_xuanhua:0 "The Xuanhua Garrison"
 emx_yan_garrison_datong:0 "The Datong Garrison"
 emx_yan_garrison_shanhaiguan:0 "The Shanhai Pass Garrison"
 emx_yan_garrison_ningyuan:0 "The Ningyuan Garrison"
 emx_yan_garrison_shenyang:0 "The Shenyang Garrison"
 emx_yan_nine_garrisons:0 "The Nine Garrisons"
 emx_yan_steppe_tribute:0 "Tribute from the Steppe"
 emx_yan_northern_wall:0 "The Northern Wall"
 emx_yan_frontier_garrison:0 "Frontier Garrison"

 ### Queen Meiying Zhu & Yan Manchuria/Korea Missions ###
 emx_yan_unify_jurchen_clans_title:0 "Unify the Jurchen Clans"
 emx_yan_unify_jurchen_clans_desc:0 "From the forested mountains of Changbai to the icy banks of the Amur, bring all Jurchen tribes under one imperial crown. The fractured steppes are forged into a mighty Manchu host."
 emx_yan_eight_banners_title:0 "Form the Eight Banners"
 emx_yan_eight_banners_desc:0 "Reorganize the combined Sino-Manchu forces into the elite Eight Banners. Combining Han firepower and Manchu horsemanship, no rebel host in China will stand against us."

 emx_yan_secure_yalu_title:0 "Secure the Yalu Crossing"
 emx_yan_secure_yalu_desc:0 "Fortify the frontier along the Yalu River. With Liaodong and Liaoxi secured, our path into the Korean peninsula lies open."
 emx_yan_march_on_pyongyang_title:0 "March on Pyongyang"
 emx_yan_march_on_pyongyang_desc:0 "Cross the Yalu in force and capture the northern Korean strongholds of Pyongan and Hamgyong, sweeping aside Joseon frontier garrisons."
 emx_yan_subjugate_joseon_title:0 "Subjugate Joseon"
 emx_yan_subjugate_joseon_desc:0 "March upon Hanseong and force King Sejong and the Joseon court to bend the knee to Queen Meiying. Korea shall serve as the faithful eastern shield of the Dragon Throne."
 emx_yan_east_sea_shipyards_title:0 "Shipyards of the East Sea"
 emx_yan_east_sea_shipyards_desc:0 "Harness the timber and naval expertise of the Korean shipyards to build a formidable fleet to rule the Yellow Sea and East Sea."




 # Modifiers
 emx_yan_eight_banners_modifier:0 "The Eight Banners"
 desc_emx_yan_eight_banners_modifier:0 "Elite Banner cavalry organized into a lethal military machine."


 # Yan Regency & Consort Events
 emx_yan_flavor.1.t:0 "The Fractured Court of Beijing"
 emx_yan_flavor.1.d:0 "Following the tragic death of the late Emperor in the Warring States chaos and the loss of her betrothed Manchu prince, the young Princess Zhu Meiying sits upon the throne of Beijing under a Regency Council. The court is paralyzed by fierce disputes between the Joseon envoys who rescued the northern capital and the Jurchen warriors who demand loyalty to the ancient pact."
 emx_yan_flavor.1.a:0 "We must endure until the Princess comes of age."

 emx_yan_flavor.2.b:0 "Embrace our Saviors: Marry the Prince of Joseon (War with Jianzhou!)"

 emx_yan_flavor.3.t:0 "The Imperial Heir & Union of the Crowns"
 emx_yan_flavor.3.d:0 "A healthy imperial heir has been born to Queen Meiying and her royal consort! With the bloodlines of both realms united in the newborn child, our claim to rule as one sovereign is absolute. The two crowns shall be bound together in an eternal Personal Union!"
 emx_yan_flavor.3.a:0 "Proclaim the Union with Manchuria!"
 emx_yan_flavor.3.b:0 "Proclaim the Union with Joseon!"

 emx_yan_divided_court:0 "Divided Northern Court"
 desc_emx_yan_divided_court:0 "Fierce friction between Joseon and Manchu factions paralyzes the court, raising power costs while providing cheap advisors and martial insight."
 emx_yan_manchu_consort_modifier:0 "Manchu Royal Union"
 desc_emx_yan_manchu_consort_modifier:0 "Fierce Jurchen cavalry and warlords bolster our imperial armies."
 emx_yan_korean_consort_modifier:0 "Joseon Royal Union"
 desc_emx_yan_korean_consort_modifier:0 "Enlightened Joseon scholars and administrators elevate imperial statecraft."

 # Childhood Education Events (Ages 5 to 15)
 emx_yan_flavor.10.d:0 "The scholarly Joseon ministers in Beijing instruct the young Princess Meiying in Confucian administration, civil law, and state finance. Her administrative intellect blossoms under their careful tutelage."

 emx_yan_flavor.11.d:0 "Veteran diplomats and ministers of the late Emperor educate Princess Meiying in dynastic statecraft, courtly eloquence, and the balance of power among the Middle Kingdom's factions."

 emx_yan_flavor.12.d:0 "Fierce Jurchen banner captains take Princess Meiying beyond the Great Wall to the northern hunting forests, training her in mounted archery, tactical maneuver, and ruthless battlefield command."

 emx_yan_flavor.2.c:0 "The Sovereign Path: Reconcile the Court (Keep Both Bonuses, No War, No PU!)"
 emx_yan_harmonized_court:0 "Harmonized Imperial Court"
 desc_emx_yan_harmonized_court:0 "Queen Meiying has masterfully harmonized the Joseon scholars and Jurchen warlords, retaining cheap advisors, skilled commanders, and reduced power costs for the empire."

 emx_yan_manchurian_hegemony:0 "Manchurian Hegemony"
 desc_emx_yan_manchurian_hegemony:0 "With the subjugation and full pacification of all Manchurian tribes, the empire's administrative reach and integration capability expand dramatically."

 emx_yan_korean_mandate_legacy:0 "Korean Imperial Legacy"
 desc_emx_yan_korean_mandate_legacy:0 "By integrating the ancient Kingdom of Joseon and its scholarly academies, the Dragon Throne adopts the refined administrative, scientific, and Neo-Confucian governance traditions of the Korean realm."

 emx_yan_korean_turtle_ships_title:0 "The Geobukseon Fleets"
 emx_yan_korean_turtle_ships_desc:0 "By adopting the ingenious ironclad Turtle Ship naval architecture developed in the southern Korean shipyards, the imperial navy gains formidable striking power in coastal and open waters."
 emx_yan_geobukseon_fleet:0 "Geobukseon Ironclad Fleet"
 desc_emx_yan_geobukseon_fleet:0 "The empire's warships are reinforced with armored decks and devastating dragon-head cannons, dominating the eastern seas."

 emx_yan_hall_of_worthies_title:0 "Jiphyeonjeon - Hall of Worthies"
 emx_yan_hall_of_worthies_desc:0 "The royal research institute of Joseon is reconstituted under imperial patronage in Beijing and Hanseong, gathering the finest Neo-Confucian philosophers and scientists to advise the crown."
 emx_yan_jiphyeonjeon_academy:0 "Hall of Worthies Academy"
 desc_emx_yan_jiphyeonjeon_academy:0 "Eminent Confucian scholars provide brilliant administrative insight, lowering idea adoption costs and advising the sovereign."

 emx_yan_hangul_printing_title:0 "The Script of Heaven"
 emx_yan_hangul_printing_desc:0 "Integrating Joseon's revolutionary movable type printing and phonetic writing system spreads literacy and administrative reform across the entire northern empire at unprecedented speed."
 emx_yan_hangul_revolution:0 "Script of Heaven & Movable Type"
 desc_emx_yan_hangul_revolution:0 "Universal literacy and advanced typography accelerate technological innovations and imperial administrative reforms."

 emx_yan_initial_branch_s1_title:0 "Awaiting the Sovereign's Coming of Age"
 emx_yan_initial_branch_s1_desc:0 "While the Grand Dowager guides the regency council, the court of Yan must prepare for the Princess's 15th birthday, when the destiny of the Northern Empire and its alliances will be decided."
 emx_yan_initial_branch_s2_title:0 "The Sovereign's Path"
 emx_yan_initial_branch_s2_desc:0 "The court waits in silence as the foreign tutors cultivate the princess's talents. Upon adulthood, the sovereign shall choose her imperial orientation."

 emx_yan_blood_pact_title:0 "The Blood Pact of Beijing"
 emx_yan_blood_pact_desc:0 "By cementing the sacred union with the Jurchen nobility of Jianzhou through marriage and mutual defense, Yan guarantees the unyielding loyalty of the northern horsemen."
 emx_yan_unify_jurchen_manchu_title:0 "Unify the Jurchen Clans"
 emx_yan_unify_jurchen_manchu_desc:0 "Together with our Jianzhou brothers, the fractured tribes of Haixi, Yeren, and Solon are brought under a single banner, forging an invincible northern shield."
 emx_yan_eight_banners_host_title:0 "The Eight Banners"
 emx_yan_eight_banners_host_desc:0 "Organizing the Jurchen and Han garrisons into the legendary Eight Banners military structure unleashes a devastating cavalry force capable of trampling any foe."
 emx_yan_eight_banners_modifier:0 "The Eight Banners Force"
 desc_emx_yan_eight_banners_modifier:0 "Elite Manchu banner hosts provide devastating shock charges and vast regiments of specialized banner warriors."



 emx_yan_flavor.4.t:0 "A Sovereign Sovereign on the Dragon Throne"
 emx_yan_flavor.4.d:0 "With the passing of Princess Meiying and the dissolution of the foreign betrothals, a new monarch now ascends the Dragon Throne in Beijing. Unbound by past agreements with either the Jurchen chieftains or the Joseon court, our sovereign sweeps aside the factional squabbles of the divided regency. Yan shall march forward on its own strength, asserting absolute dominance over both Manchuria and Korea!"
 emx_yan_flavor.4.a:0 "The Sovereign Path: Neither Manchu nor Joseon shall rule us!"

 # Official Branching Mission Selection GUI Localisation
 emx_yan_select_dynasty_branch_1_title:0 "The Sovereign's Imperial Path"
 emx_yan_select_dynasty_branch_1_desc:0 "Upon ascending the Dragon Throne at age 15, Queen Meiying must select the imperial orientation of Yan using the Branch Review buttons on the right side of the Mission Tree window."
 emx_yan_select_dynasty_branch_2_title:0 "The Chosen Alliance"
 emx_yan_select_dynasty_branch_2_desc:0 "The diplomatic fate of the Northern Empire will be locked in once the sovereign confirms her chosen path."

 yan_selectable_branch_trigger_tt:0 "§YBranch Selection is available!§! Click the §G1§!, §G2§!, or §G3§! buttons on the top right panel of this Mission window to preview each branch, and click the §YSelect Current Branch§! button to lock in your choice."
 yan_select_branch_guidance_tt:0 "§GOpen your Mission Tree window and use the interactive Branch Preview buttons on the right panel to explore and select your path!§!"

 yan_preview_manchu_tt:0 "§YThe Manchu Union§!\n- Forges an Alliance and Royal Marriage with §YJianzhou§!.\n- Breaks relations with §YJoseon§!, who plunders §R500 ducats§! and incites a §R20k noble revolt§! in Beijing.\n- Removes §YDivided Northern Court§! modifier.\n- Suffers §R+25.0% Advisor Cost§! and §R+5.0% All Power Cost§! for 25 years.\n- Grants §GManchu Royal Union§! (+10% Shock Damage, +1 Land Leader Shock).\n- Unlocks the Jurchen Unification and Eight Banners missions."
 yan_preview_korea_tt:0 "§Y[Previewing Branch 2: The Joseon Alliance & Korean Imperial Legacy]§!\nReview the Joseon partnership, Manchurian pacification (+5% Admin Efficiency), automatic Joseon integration, and Emperor of China mission tree."
 yan_preview_harmony_tt:0 "§Y[Previewing Branch 3: The Sovereign Path & Dual Conquest]§!\nReview the standalone conquest of both Manchuria and Korea, permanent claims on Japan, and balanced court governance."

 yan_select_branch_manchu_failed_tt:0 "§RYou do not meet the requirements to select the Manchu Path!§!\n(Requires Queen Meiying with Military Education higher than or equal to Admin Education, or MIL ≥ 3)"
 yan_select_branch_korea_failed_tt:0 "§RYou do not meet the requirements to select the Korea Path!§!\n(Requires Queen Meiying with Admin Education higher than or equal to Military Education, or ADM ≥ 2)"
 yan_select_branch_harmony_failed_tt:0 "§RYou do not meet the requirements to select the Sovereign Path!§!\n(Requires Diplomatic Education to be highest/tied, DIP ≥ 3, or Meiying's passing)"

 emx_yan_flavor.5.t:0 "Queen Meiying's Coming of Age"
 emx_yan_flavor.5.d:0 "Princess Meiying has reached her fifteenth year, ending the regency and ascending the Dragon Throne of Beijing as Queen! The time has arrived to determine the imperial destiny of Yan. Open your Mission Tree to preview the Manchu, Korean, or Sovereign branches on the right-hand panel and seal the fate of the realm!"
 emx_yan_flavor.5.a:0 "I shall consult the Mission Tree."

 emx_yan_manchu_branch_name:0 "The Manchu Union"
 emx_yan_korea_branch_name:0 "The Joseon Alliance"
 emx_yan_harmony_branch_name:0 "The Sovereign Path"

 yan_must_confirm_branch_first_tt:0 "You must confirm this branch by clicking the §YSelect Current Mission Branch§! (Tick) button on the right panel before you can complete missions in this path."
# Path 3: Sovereign & Harmony Branch
 emx_yan_dowry_harmony_title:0 "The Sovereign Imperial Dowry"
 emx_yan_dowry_harmony_desc:0 "Queen Meiying asserts her independent sovereignty over Beijing, using diplomatic grace and ancient pacts to pacify both the northern Jurchen chieftains and the Joseon court."
 emx_yan_subdue_harmony_title:0 "Tame the Northern Frontier"
 emx_yan_subdue_harmony_desc:0 "Through diplomatic pacts and calculated demonstrations of imperial force, establish stable frontier garrisons across Liaodong and Jilin."
 emx_yan_unify_harmony_title:0 "Sino-Northern Concord"
 emx_yan_unify_harmony_desc:0 "Bring peace and order to all Manchuria without senseless bloodshed, binding Jurchen tribesmen into our imperial commonwealth."
 emx_yan_yalu_harmony_title:0 "Guardians of the Yalu"
 emx_yan_yalu_harmony_desc:0 "Fortify the Yalu River frontier, guaranteeing peaceful trade and military cooperation with Joseon."
 emx_yan_subjugate_harmony_title:0 "Eastern Harmonious Sphere"
 emx_yan_subjugate_harmony_desc:0 "Solidify our imperial hegemony over the eastern seas, integrating Korean scholars and trade networks into the Yan court."

 # Yan Silk Road & Spice Route Localisations
 emx_yan_silk_road_1_title:0 "Open the Hexi Corridor"
 emx_yan_silk_road_1_desc:0 "Secure the oasis garrisons of Gansu and West Gansu, reopening the historic Silk Road to the western realms."
 emx_yan_silk_road_2_title:0 "The Tarim Basin Oases"
 emx_yan_silk_road_2_desc:0 "Bring the desert oasis kingdoms of the Tarim Basin under imperial protection, securing camel caravans laden with silk and jade."
 emx_yan_silk_road_crimea_title:0 "The Northern Silk Terminus"
 emx_yan_silk_road_crimea_desc:0 "Extend our overland trading network to the Black Sea emporiums in Crimea, trading directly with the merchants of Europe."
 emx_yan_silk_road_persia_title:0 "Caravans of the Iranian Plateau"
 emx_yan_silk_road_persia_desc:0 "Secure trade access through Tabriz and Isfahan, channeling Persian rugs, lapis lazuli, and saffron to Beijing."
 emx_yan_silk_road_trabzon_title:0 "The Pontic Gates"
 emx_yan_silk_road_trabzon_desc:0 "Establish merchant houses in Trebizond, controlling the vital junction between Anatolia and the Caucasus."
 emx_yan_silk_road_halep_sham_title:0 "The Levantine Emporiums"
 emx_yan_silk_road_halep_sham_desc:0 "Anchor our western trade routes in Aleppo and Damascus, connecting the Silk Road to Mediterranean galleys."
 emx_yan_silk_road_capstone_title:0 "Master of the Great Silk Road"
 emx_yan_silk_road_capstone_desc:0 "From the walls of Beijing to the ports of the Mediterranean, the Great Silk Road beats as one heart under Yan supremacy."

 emx_yan_spice_route_malacca_title:0 "The Strait of Malacca"
 emx_yan_spice_route_malacca_desc:0 "Project our naval presence into Malacca, controlling the world's richest choke point for cloves, nutmeg, and pepper."
 emx_yan_spice_route_bengal_title:0 "The Bay of Bengal"
 emx_yan_spice_route_bengal_desc:0 "Establish trade dominance in the Ganges delta, collecting the rich muslins, jute, and spices of Bengal."
 emx_yan_spice_route_coromandel_title:0 "The Coromandel Coast"
 emx_yan_spice_route_coromandel_desc:0 "Dominate the textile and spice ports of Southern India, sending treasure ships back to the Yellow Sea."
 emx_yan_spice_route_gujarat_title:0 "The Gulf of Khambhat"
 emx_yan_spice_route_gujarat_desc:0 "Secure the commercial ports of Gujarat, the gateway to Arabian and Indian Ocean commerce."
 emx_yan_spice_route_hormuz_title:0 "The Pearl of Hormuz"
 emx_yan_spice_route_hormuz_desc:0 "Seize the Island of Hormuz and control all trade flowing between the Persian Gulf and the Indian Ocean."
 emx_yan_spice_route_aden_title:0 "The Gate of Tears"
 emx_yan_spice_route_aden_desc:0 "Establish an imperial trading base in Aden, commanding access to the Red Sea, frankincense, and myrrh."
 emx_yan_spice_route_alexandria_title:0 "The Alexandria Terminus"
 emx_yan_spice_route_alexandria_desc:0 "Dominate the ancient port of Alexandria, supplying all of Europe with Eastern spices at imperial prices."
 emx_yan_spice_route_capstone_title:0 "Sovereign of the Maritime Silk Route"
 emx_yan_spice_route_capstone_desc:0 "The Dragon fleets reign supreme across every sea from Bohai Bay to the Nile, extracting tribute and wealth from global trade."

emx_yan_korean_betrayal_fallout:0 "Joseon Envoy Exodus"
 desc_emx_yan_korean_betrayal_fallout:0 "In retaliation for our alliance with the Jurchen horsemen, Joseon envoys and scholars plundered 500 ducats from the state treasury and fled Beijing, leaving the imperial administration in turmoil."

emx_yan_conquer_japan_harmony_title:0 "Conquer the Japanese Isles"
 emx_yan_conquer_japan_harmony_desc:0 "With Manchuria pacified and Korea united under imperial harmony, cross the Tsushima Strait and bring the warring clans of the Rising Sun to heel. The pacified archipelago becomes our launchpad for Pacific exploration and global colonization."
 emx_yan_harmony_navy:0 "Harmonious Imperial Fleet"
 desc_emx_yan_harmony_navy:0 "Unifying the naval traditions of the Yellow Sea and Korean shipwrights grants our fleet superior durability and unwavering morale."
 emx_yan_pacific_colonization:0 "Pacific Colonial Expeditions"
 desc_emx_yan_pacific_colonization:0 "Having conquered the Japanese archipelago, imperial navigators and pioneers sail into the uncharted Pacific with state-sponsored colonial expeditions."

emx_yan_flavor.10.t:0 "The Education of Princess Meiying: Early Tutelage"
 emx_yan_flavor.10.d:0 "As the young princess Meiying reaches her formative childhood years in the imperial palace of Beijing, the court deliberates upon the mentors who shall shape her worldview."
 emx_yan_flavor.10.a:0 "Appoint Jurchen steppe chieftains (+1 MIL, Manchu Focus)"
 emx_yan_flavor.10.b:0 "Invite Joseon Neo-Confucian scholars (+1 ADM, Korean Focus)"
 emx_yan_flavor.10.c:0 "Rely on Imperial Ming loyalist statesmen (+1 DIP, Harmony Focus)"

 emx_yan_flavor.11.t:0 "The Education of Princess Meiying: Youth Strategy"
 emx_yan_flavor.11.d:0 "Princess Meiying has grown into a sharp and observant youth. Her daily lessons now turn toward practical matters of statecraft, war, and diplomatic maneuvering."
 emx_yan_flavor.11.a:0 "Train in nomadic warfare and cavalry tactics (+1 MIL, Manchu Focus)"
 emx_yan_flavor.11.b:0 "Instruct in imperial bureaucracy and law (+1 ADM, Korean Focus)"
 emx_yan_flavor.11.c:0 "Master classical court diplomacy and balance (+1 DIP, Harmony Focus)"

 emx_yan_flavor.12.t:0 "The Education of Princess Meiying: Ideology & Rule"
 emx_yan_flavor.12.d:0 "Princess Meiying approaches the cusp of adulthood. Her final mentorship will definitively determine the philosophical foundation of her future reign."
 emx_yan_flavor.12.a:0 "Embrace the warrior ethos of the Northern Steppe (+1 MIL, Manchu Focus)"
 emx_yan_flavor.12.b:0 "Embrace scholarly Confucian governance (+1 ADM, Korean Focus)"
 emx_yan_flavor.12.c:0 "Embrace supreme imperial autonomy and balance (+1 DIP, Harmony Focus)"


 emx_yan_chosen_dynasty_opinion:0 "Imperial Dynasty Union"

emx_yan_flavor.2.t:0 "The Coronation of Queen Meiying"
 emx_yan_flavor.2.d:0 "Having reached her fifteenth year, the regency council of Beijing dissolves as Princess Meiying is formally crowned Queen of Yan. Educated in statecraft, warfare, and imperial philosophy, Her Majesty now turns her gaze toward the grand strategic crossroads of East Asia.\n\nOpen the §YMission Tree§! to review the prospective Dynasty Branches and confirm the destiny of the realm."
 emx_yan_flavor.2.a:0 "Long live Queen Meiying!"
 yan_meiying_coronation_guidance_tt:0 "§YQueen Meiying has taken the throne!§!\nOpen the §YMission Tree§! and click the §Y[✓] (Select Current Mission Branch)§! button to choose your dynasty path."

yan_manchu_branch_req_tt:0 "Queen Meiying must have come of age and chosen the Jurchen Steppe Betrothal in her Coronation Event."
 yan_korea_branch_req_tt:0 "Queen Meiying must have come of age and chosen the Joseon Scholarly Marriage in her Coronation Event."
 yan_harmony_branch_req_tt:0 "Queen Meiying must have come of age and chosen Imperial Autonomy in her Coronation Event."

emx_yan_pacify_mongolia_title:0 "Subjugate the Mongolian Steppes"
 emx_yan_mandate_of_the_steppes:0 "Mandate of the Northern Steppes"
 desc_emx_yan_mandate_of_the_steppes:0 "Our total pacification and integration of the northern steppe nomads grants an unshakeable aura of divine authority to our imperial court."

emx_yan_unify_north_china_title:0 "Consolidate the Yellow River Basin"
 emx_yan_northern_fortress:0 "Fortress of the North"
 desc_emx_yan_northern_fortress:0 "Our reinforced imperial citadel network and garrison vigilance grants unmatched defensive superiority against all invaders."
 emx_yan_subjugate_joseon_integrate_tt:0 "Directly §Gintegrates and inherits§! the Kingdom of §YJoseon§! into our realm and expands our mission tree with the §YJoseon Imperial & Renaissance Legacy§!."
emx_yan_muster_host_title:0 "Muster the Grand Host"
 emx_yan_muster_host_desc:0 "To secure the Yan throne against all rivals in the Central Plains, our banners must be mustered to their maximum military capacity. Expanding our army to full strength allows us to project our royal power westward into Shanxi and eastward into Shandong."
emx_yan_jurchen_dowry_title:0 "The Northern Frontier Dowry"
 emx_yan_jurchen_dowry_desc:0 "Using ancient alliances and imperial authority over Beijing, Queen Meiying rallies our forces to pacify the northern frontier and secure the marches of Liaodong."
 emx_yan_subdue_jianzhou_title:0 "Subjugate Jianzhou & Haixi"
 emx_yan_subdue_jianzhou_desc:0 "Bring the southern and central Jurchen clans of Jianzhou and Haixi beneath the Yan crown, securing stable garrisons across Jilin and the eastern passes."
 emx_yan_banish_steppe_nomads_title:0 "The Sino-Northern Concord"
 emx_yan_banish_steppe_nomads_desc:0 "Pacify the northern nomads across all nine areas of Manchuria. With the entire northeastern frontier unified and secured under our banner, the empire cements its Manchurian hegemony."
 emx_yan_pacify_mongolia_title:0 "Subjugate the Mongolian Steppes"
 emx_yan_pacify_mongolia_desc:0 "The nomadic horse lords of the Mongolian plateau have posed a constant menace to China for millennia. By pacifying the khans across the steppes, the Yan Dynasty cements its divine mandate over the northern world."
 emx_yan_unify_north_china_title:0 "Consolidate the Yellow River Basin"
 emx_yan_unify_north_china_desc:0 "The ancient heartlands of the Central Plains and the Yellow River valley bow to the Yan throne. Reinforcing our frontier fortresses, our armies prepare the grand southward campaign to unite all of China under Heaven."
 emx_yan_yalu_manchu_title:0 "Secure the Yalu Frontier"
 emx_yan_yalu_manchu_desc:0 "The Yalu River marks the ancient boundary between China and the Korean peninsula. Mobilizing our garrisons along the river allows our forces to project imperial authority southward into the Kingdom of Joseon."
