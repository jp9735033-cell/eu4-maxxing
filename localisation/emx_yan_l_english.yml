 emx_yan_court_divided_title:0 "A Divided Court"
 emx_yan_court_divided_desc:0 "The regency council governs in the name of the young empress. Factions vie for influence as the realm awaits her coronation and the choice of a royal consort."
 emx_yan_foreign_diplomacy_title:0 "Foreign Diplomacy"
 emx_yan_foreign_diplomacy_desc:0 "The court must establish diplomatic ties with neighboring kingdoms before the empress can choose her path forward."
emx_yan_eoc_mng_cornerstone_empire3_title:0 "Cornerstone of Empire"
 emx_yan_eoc_mng_cornerstone_empire3_desc:0 "To establish eternal harmony across the realm, our administration must be solidified with competent governors and stable finances."
 emx_yan_eoc_mng_censorate3_title:0 "Establish the Censorate"
 emx_yan_eoc_mng_censorate3_desc:0 "Appoint incorruptible imperial censors to inspect province administrators and eliminate graft throughout the court."
 emx_yan_eoc_mng_promote_grand_coordinators3_title:0 "Promote Grand Coordinators"
 emx_yan_eoc_mng_promote_grand_coordinators3_desc:0 "Appoint regional Grand Coordinators to oversee provincial governors and streamline tax collection and military levies."
 emx_yan_eoc_mng_reform_civil_registration3_title:0 "Reform Civil Registration"
 emx_yan_eoc_mng_reform_civil_registration3_desc:0 "Audit the Yellow Registers and imperial census to ensure all households contribute their rightful share to the realm."
 emx_yan_eoc_mng_examination_system3_title:0 "The Imperial Examination"
 emx_yan_eoc_mng_examination_system3_desc:0 "Restore the rigorous imperial triennial examination system, elevating scholars of genuine talent to high office."
 emx_yan_eoc_mng_mutual_trade_system3_title:0 "The Mutual Trade System"
 emx_yan_eoc_mng_mutual_trade_system3_desc:0 "Establish regulated border markets and tribute trade networks to secure wealth and peace with neighboring tributaries."
 emx_yan_eoc_mng_tame_china_sorrow3_title:0 "Tame the Yellow River"
 emx_yan_eoc_mng_tame_china_sorrow3_desc:0 "Construct grand dykes and spillways along the Yellow River basin to permanently prevent catastrophic floods and preserve prosperity."
 emx_yan_eoc_mng_single_whip_law3_title:0 "The Single Whip Law"
 emx_yan_eoc_mng_single_whip_law3_desc:0 "Consolidate all taxes and labor duties into a single payment in silver, drastically improving trade circulation and revenue."
 emx_yan_eoc_mng_pure_land3_title:0 "The Pure Land"
 emx_yan_eoc_mng_pure_land3_desc:0 "Promote spiritual harmony and monastic patronage to cultivate peace and contentment across all under Heaven."
 emx_yan_eoc_mng_shengshi_zhishi3_title:0 "Age of Prosperity and Peace"
 emx_yan_eoc_mng_shengshi_zhishi3_desc:0 "With our frontiers secure and governance perfected, our dynasty enters a golden era of unrivalled splendor and peace."
 emx_yan_eoc_mng_expand_bogue3_title:0 "Expand the Bogue Forts"
 emx_yan_eoc_mng_expand_bogue3_desc:0 "Fortify the Pearl River approaches with coastal batteries to secure maritime trade against corsairs and foreign fleets."
 emx_yan_eoc_mng_jing_hang_grand_canal3_title:0 "Restore the Grand Canal"
 emx_yan_eoc_mng_jing_hang_grand_canal3_desc:0 "Dredge and expand the Grand Canal, ensuring boundless shipments of grain and silk flow smoothly between north and south."
 emx_yan_eoc_mng_expand_yongle_dadian3_title:0 "The Great Imperial Encyclopaedia"
 emx_yan_eoc_mng_expand_yongle_dadian3_desc:0 "Commission our grandest scholars to compile the vast compendium of all ancient and modern knowledge into imperial archives."
 emx_yan_eoc_mng_form_depots3_title:0 "Establish Imperial Grain Depots"
 emx_yan_eoc_mng_form_depots3_desc:0 "Build everlasting granaries across every circuit to guarantee famine relief and feed our grand marching armies."
 emx_yan_eoc_mng_outer_city_beijing3_title:0 "The Outer City of Beijing"
 emx_yan_eoc_mng_outer_city_beijing3_desc:0 "Encircle Beijing with monumental outer walls and bustling markets worthy of the undisputed capital of the Eastern World."
 emx_yan_eoc_mng_fortify_coast3_title:0 "Fortify the Coastlines"
 emx_yan_eoc_mng_fortify_coast3_desc:0 "Erect coastal beacon towers and garrison watchposts to safeguard the empire against wako raiders and foreign armadas."

