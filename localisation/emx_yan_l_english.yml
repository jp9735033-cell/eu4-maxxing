 emx_yan_unify_china_title:0 "Unify China"
 emx_yan_unify_china_desc:0 "From the Northern Plains of Beijing to the Southern Delta of Canton, the fractured realm must be forged into one indivisible celestial empire beneath our mandate."
 emx_yan_init_silk_road_1_title:0 "Open the Hexi Corridor"
 emx_yan_init_silk_road_1_desc:0 "The Hexi Corridor is the gateway to the West. Re-establishing full imperial control over Gansu secures the first leg of the Silk Road."
 emx_yan_init_silk_road_2_title:0 "The Road to Samarkand"
 emx_yan_init_silk_road_2_desc:0 "Send merchants and garrisons west into the Tarim Basin and Transoxiana, reviving trade with Samarkand."
 emx_yan_init_silk_road_crimea_title:0 "Northern Route: Crimea"
 emx_yan_init_silk_road_crimea_desc:0 "Extend the northern branch of the Silk Road through the Eurasian steppes directly to the Black Sea ports of Crimea and Azov."
 emx_yan_init_silk_road_persia_title:0 "Caravans of the Iranian Plateau"
 emx_yan_init_silk_road_persia_desc:0 "Establish regular trading routes across Khorasan, Tabriz, and the Iranian plateau."
 emx_yan_init_silk_road_trabzon_title:0 "Anatolian Route: Trabzon"
 emx_yan_init_silk_road_trabzon_desc:0 "Secure maritime and caravan access to Trebizond on the southern shores of the Black Sea."
 emx_yan_init_silk_road_capstone_title:0 "Rome: Legacy of the Silk Road"
 emx_yan_init_silk_road_capstone_desc:0 "With control of Constantinople, Thrace, and the great convergence of world trade, the Silk Road is fully restored beneath our divine mandate."
