 emx_yan_subjugate_joseon_manchu_title:0 "Confront Joseon"
 emx_yan_subjugate_joseon_manchu_desc:0 "With our union with the Jurchen tribes sealed, the court in Hanseong has turned hostile. We must march south across the Yalu and force Joseon to recognize our supremacy."
 emx_yan_yalu_manchu_title:0 "The Yalu Frontier"
 emx_yan_yalu_manchu_desc:0 "Prepare our northern garrisons and muster the banners along the Yalu River to defend against Korean incursions and prepare for offensive campaigns."
 emx_yan_jurchen_dowry_k_title:0 "Northern Frontier Vigil"
 emx_yan_jurchen_dowry_k_desc:0 "Having united with Joseon, the Jurchen clans beyond the wall harbor bitter resentment. Fortify the frontier watchtowers to crush any barbarian raids."
 emx_yan_subdue_jianzhou_k_title:0 "Subdue the Jurchen Tribes"
 emx_yan_subdue_jianzhou_k_desc:0 "Lead a combined Yan-Joseon host beyond the Great Wall to pacify the rebellious Jurchen clans once and for all."
 emx_yan_jurchen_dowry_h_title:0 "Envoys to the Jurchen"
 emx_yan_jurchen_dowry_h_desc:0 "Dispatch seasoned imperial envoys and trade missions to the Jurchen chieftains, securing their respect and peaceful tribute through sovereign balance."
 emx_yan_yalu_harmony_title:0 "Envoys to Joseon"
 emx_yan_yalu_harmony_desc:0 "Send diplomatic legations to the Joseon court in Hanseong, preserving ancient bonds of Confucian friendship and maritime commerce without foreign entanglements."
 emx_yan_chosen_dynasty_opinion:0 "Dynastic Union & Harmony"

 emx_yan_manchu_korea_prep_trigger_tt:0 "§YJianzhou§! has less than §G50%§! Liberty Desire and §YYan§! has an army equal to or larger than §YJoseon (Korea)§!."
 emx_yan_siege_prep:0 "Invasion Preparations"
 desc_emx_yan_siege_prep:0 "Extensive siege drills and tactical plans prepared against Korean fortress networks."
 emx_yan_siege_mastery:0 "Siege Mastery of the Peninsula"
 desc_emx_yan_siege_mastery:0 "Unrivalled mastery over coastal and mountain fortifications across the empire."


