 emx_shu_silk_road_persia_title:0 "Southern Route: Persia"
 emx_shu_silk_road_persia_desc:0 "Subjugate the Iranian Plateau and its historic markets of Isfahan and Tabriz. Grants +75% Caravan Power."
 emx_shu_silk_road_trabzon_title:0 "Pontic Gateway: Trabzon"
 emx_shu_silk_road_trabzon_desc:0 "Control the Pontic Black Sea terminus at Trabzon and the major market of Tabriz to secure the northern Anatolian trade route. Grants +100% Caravan Power, +25% Price for Chinaware & Silk."
 emx_shu_silk_road_halep_sham_title:0 "Levant Termini: Halep & Sham"
 emx_shu_silk_road_halep_sham_desc:0 "Conquer and core the ancient Mediterranean trade hubs of Aleppo, Damascus, and Antioch. Grants +100% Caravan Power, +25% Price for Chinaware & Silk."
 emx_shu_silk_road_capstone_title:0 "Lord of the Silk Road"
 emx_shu_silk_road_capstone_desc:0 "From China through Samarkand to Crimea, Trabzon, and Damascus, the entire expanse of the Silk Road is under our undisputed dominion. Grants +25% Trade Steering, +25% Trade Efficiency, and +200% Caravan Power."
 emx_shu_spice_route_malacca_title:0 "Spice Route: Malacca"
 emx_shu_spice_route_malacca_desc:0 "The Strait of Malacca connects the South China Sea to the Indian Ocean. Secure at least 50% trade share in the Malacca trade node."
 emx_shu_spice_route_bengal_title:0 "Spice Route: Bengal"
 emx_shu_spice_route_bengal_desc:0 "The rich ports and delta of Bengal channel the wealth of eastern India. Reach at least 50% trade share in the Bengal trade node."
 emx_shu_spice_route_coromandel_title:0 "Spice Route: Coromandel"
 emx_shu_spice_route_coromandel_desc:0 "The textile emporiums of the Coromandel coast supply western and eastern commerce. Reach at least 50% trade share in Coromandel."
 emx_shu_spice_route_gujarat_title:0 "Spice Route: Gujarat"
 emx_shu_spice_route_gujarat_desc:0 "The Gujarati ports and Surat command the wealth of western India. Reach at least 50% trade share in the Gujarat trade node."
 emx_shu_spice_route_hormuz_title:0 "Spice Route: Hormuz"
 emx_shu_spice_route_hormuz_desc:0 "The Strait of Hormuz controls all maritime entrance into the Persian Gulf. Reach at least 50% trade share in Hormuz. Grants +25% Price for Spices and Tea."
 emx_shu_spice_route_aden_title:0 "Spice Route: Gulf of Aden"
 emx_shu_spice_route_aden_desc:0 "The Bab-el-Mandeb gates the maritime route between the Indian Ocean and the Red Sea. Reach at least 50% trade share in the Gulf of Aden."
 emx_shu_spice_route_alexandria_title:0 "Spice Route: Alexandria"
 emx_shu_spice_route_alexandria_desc:0 "Alexandria connects the riches of the Orient directly to Mediterranean commerce. Reach at least 50% trade share in Alexandria. Grants +25% Price for Spices and Tea."
 emx_shu_spice_route_capstone_title:0 "Master of the Spice Routes"
 emx_shu_spice_route_capstone_desc:0 "Our merchant fleets command every key sea lane from Malacca across India, Arabia, and Egypt. The maritime Spice Route is our personal monopoly. Permanently increases the global price of Spices and Tea by +50%."
