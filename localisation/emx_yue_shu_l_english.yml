l_english:

 ### Shu missions ###
 emx_shu_seize_beijing_title:0 "Take Beijing"
 emx_shu_seize_beijing_desc:0 "The Han restoration was always a march on the northern capital. Take Beijing and core it."
 emx_shu_seize_hangzhou_title:0 "Take Hangzhou"
 emx_shu_seize_hangzhou_desc:0 "Wu sits at the mouth of our river. Take Hangzhou and core it."
 emx_shu_seize_canton_title:0 "Take Canton"
 emx_shu_seize_canton_desc:0 "Take Canton and core it, and the southern sea trade pays for the western roads."
 emx_shu_home_1_title:0 "Rebuild Chengdu"
 emx_shu_home_1_desc:0 "Chengdu is the granary of the west. Bring it to 30 development."
 emx_shu_home_2_title:0 "The Wharves of Chongqing"
 emx_shu_home_2_desc:0 "Bring Chongqing to 30 development."
 emx_shu_home_3_title:0 "The Fields of Langzhong"
 emx_shu_home_3_desc:0 "Bring Langzhong to 30 development."
 emx_shu_home_4_title:0 "The Songqu Marches"
 emx_shu_home_4_desc:0 "Bring Songqu to 30 development."
 emx_shu_home_5_title:0 "The Dazhou Terraces"
 emx_shu_home_5_desc:0 "Bring Dazhou to 30 development."
 emx_shu_home_6_title:0 "The Jiazhou Ferry"
 emx_shu_home_6_desc:0 "Bring Jiazhou to 30 development."
 emx_shu_home_7_title:0 "The Luzhou Market"
 emx_shu_home_7_desc:0 "Bring Luzhou to 30 development. The basin is fully in hand."
 emx_shu_west_1_title:0 "The Roads to Lhasa"
 emx_shu_west_1_desc:0 "Hold Lhasa and Shigatse and eight provinces of Utsang, Tsang and Ngari. Mountain roads cost what mountain roads cost - after this, they cost less."
 emx_shu_west_2_title:0 "The Kham Highlands"
 emx_shu_west_2_desc:0 "Hold Tachienlu and Gyegu and seven provinces of Kham and Amdo."
 emx_shu_west_3_title:0 "The Tea-Horse Road"
 emx_shu_west_3_desc:0 "Take Changtang, Tsaparang and Paro. With the last stages of the Lhasa trade outside Nepal in hand, the whole route is ours."
 emx_shu_west_4_title:0 "The Hexi Corridor"
 emx_shu_west_4_desc:0 "Yumen, Zhangye, Liangzhou and Xining. Desert costs half again to settle - it will not any more."
 emx_shu_west_5_title:0 "Ready For China"
 emx_shu_west_5_desc:0 "Hold five provinces of Shanshan and the Turpan-Kumul oases."
 emx_shu_west_6_title:0 "The Cities of Altishahr"
 emx_shu_west_6_desc:0 "Take Kashgar and hold six provinces of the Tarim basin and Kashgaria."
 emx_shu_west_7_title:0 "South Dzungaria"
 emx_shu_west_7_desc:0 "Hold four provinces of Dzungaria. The west is a country now, not a frontier."
 emx_shu_secure_hanzhong_title:0 "Secure Hanzhong"
 emx_shu_secure_hanzhong_desc:0 "Every march out of Sichuan and every march into it goes through Hanzhong. Take it and core it."
 emx_shu_southern_campaign_title:0 "The Southern Campaign"
 emx_shu_southern_campaign_desc:0 "Guiyang, Liangshan, Zhenyuan and Bozhou. Pacify the south before turning north, as it was done before."
 emx_shu_northern_expeditions_title:0 "The Northern Expeditions"
 emx_shu_northern_expeditions_desc:0 "Xi'an, Fengxiang and Tianshui, owned and cored. The expedition that was tried six times succeeds once."
 emx_shu_tea_horse_road_title:0 "The Horse Markets"
 emx_shu_tea_horse_road_desc:0 "Hold Taozhou, Xining and Gyegu and field twenty regiments of cavalry. Tea goes west, horses come east."

 ### Yue missions ###
 emx_yue_seize_beijing_title:0 "Take Beijing"
 emx_yue_seize_beijing_desc:0 "The north has taxed the southern trade for centuries. Take Beijing and core it, and the accounts are settled."
 emx_yue_seize_hangzhou_title:0 "Take Hangzhou"
 emx_yue_seize_hangzhou_desc:0 "Two great ports cannot both rule the coast. Take Hangzhou and core it."
 emx_yue_seize_chengdu_title:0 "Take Chengdu"
 emx_yue_seize_chengdu_desc:0 "Take Chengdu and core it, and the upper river is closed to everyone but us."
 emx_yue_home_1_title:0 "Rebuild Canton"
 emx_yue_home_1_desc:0 "Canton is the gate of the southern sea. Bring it to 30 development."
 emx_yue_home_2_title:0 "The Anchorage at Macau"
 emx_yue_home_2_desc:0 "Bring Macau to 30 development."
 emx_yue_home_3_title:0 "The Shiuhing Reach"
 emx_yue_home_3_desc:0 "Bring Shiuhing to 30 development."
 emx_yue_home_4_title:0 "Chinese Border"
 emx_yue_home_4_desc:0 "Bring Leichow to 30 development."
 emx_yue_home_5_title:0 "The Limchow Coast"
 emx_yue_home_5_desc:0 "Bring Limchow to 30 development."
 emx_yue_home_6_title:0 "Conquest South"
 emx_yue_home_6_desc:0 "Bring Kingchow to 30 development."
 emx_yue_home_7_title:0 "Conquest North"
 emx_yue_home_7_desc:0 "Bring Ngaichow to 30 development. The home coast is finished."
 emx_yue_sea_1_title:0 "The Pearl River Ports"
 emx_yue_sea_1_desc:0 "Hold Canton, Macau and Shiuhing and put fifteen ships to sea."
 emx_yue_sea_2_title:0 "Control Islands"
 emx_yue_sea_2_desc:0 "Hold Kingchow, Leichow and Limchow and put twenty-five ships to sea."
 emx_yue_sea_3_title:0 "Improved Islands"
 emx_yue_sea_3_desc:0 "Hold Ngaichow, Ngchow, Waichow and Shiukwan."
 emx_yue_sea_4_title:0 "Road to Moluccas"
 emx_yue_sea_4_desc:0 "Take and core Chaochow, Xiamen and Fuzhou. The whole southern coast builds our hulls."
 emx_yue_sea_5_title:0 "Control Moluccas"
 emx_yue_sea_5_desc:0 "Sixty ships at sea. Every port we own becomes a station of the fleet."
 emx_yue_two_guangs_title:0 "Unite the Two Guangs"
 emx_yue_two_guangs_desc:0 "Guilin, Liuzhou, Namning, Guangxi and Ngchow, owned and cored. Nanyue is whole again."
 emx_yue_bogue_forts_title:0 "Conquest of Siam"
 emx_yue_bogue_forts_desc:0 "A fort at Canton, a shipyard at Macau and thirty ships. Nothing enters the estuary without our leave."
 emx_yue_jiaozhi_title:0 "Conquest of China"
 emx_yue_jiaozhi_desc:0 "Thang Long and Viet Bac, owned and cored. The southern commandery answers to Canton again."
 emx_yue_nanyang_trade_title:0 "The Nanyang Trade"
 emx_yue_nanyang_trade_desc:0 "Hold four provinces in Malaya. The south sea trade has a landlord."
 emx_yue_unify_china_title:0 "Unify China"
 emx_yue_unify_china_desc:0 "Beijing, Hangzhou, Chengdu, Canton and Shenyang, all owned and all cored. The warring states end here."
 emx_yue_army_1_title:0 "The Divine Engine Division"
 emx_yue_army_1_desc:0 "Reach military technology 20 and field twenty regiments of artillery."
 emx_yue_army_2_title:0 "Drill the Green Standard"
 emx_yue_army_2_desc:0 "Reach 50% army professionalism and 60 army tradition."
 emx_yue_army_3_title:0 "The New Model Army"
 emx_yue_army_3_desc:0 "Reach military technology 26 and 80% army professionalism."
 emx_yue_industry_1_title:0 "The Kilns of Jingdezhen"
 emx_yue_industry_1_desc:0 "Hold Poyang and Nanchang, and the porcelain of the empire is made to our order."
 emx_yue_industry_2_title:0 "The Looms of Jiangnan"
 emx_yue_industry_2_desc:0 "Hold Suzhou, Hangzhou, Zhenjiang and Shaoxin."
 emx_yue_industry_3_title:0 "The Ironworks of Guangdong"
 emx_yue_industry_3_desc:0 "Hold Canton, Shiuhing and Macau."
 emx_yue_industry_4_title:0 "The Salt and Tea Monopolies"
 emx_yue_industry_4_desc:0 "Hold Huai'an, Chengdu and Chongqing, and the two great monopolies pay for the state."
 emx_yue_industry_5_title:0 "The Workshops of the North"
 emx_yue_industry_5_desc:0 "Hold Beijing, Jinan, Kaifeng and Xi'an."

